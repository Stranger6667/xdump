[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdump"
dynamic = ["version"]
description = "Consistent partial database dump utility"
keywords = ["database", "dump", "postgresql", "sqlite"]
authors = [{ name = "Dmitry Dygalo", email = "dmitry@dygalo.dev" }]
maintainers = [{ name = "Dmitry Dygalo", email = "dmitry@dygalo.dev" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Typing :: Typed",
]
dependencies = ["click>=8", "psycopg2>=2.9.5"]

[project.optional-dependencies]
django = ["django>=4.2"]
tests = [
  "coverage[toml]>=7.2",
  "django>=4.2",
  "pytest>=8",
  "pytest-click>=1.1",
  "pytest-django>=4.5",
  "pytest-postgresql>=9",
]

[project.scripts]
xdump = "xdump.cli.dump:dump"
xload = "xdump.cli.load:load"

[project.urls]
Changelog = "https://github.com/Stranger6667/xdump/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Stranger6667/xdump/issues"
Funding = "https://github.com/sponsors/Stranger6667"
"Source Code" = "https://github.com/Stranger6667/xdump"

[tool.hatch.version]
path = "src/xdump/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/test"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
testpaths = ["test"]
pythonpath = ["."]
markers = ["dump", "postgres", "sqlite"]
DJANGO_SETTINGS_MODULE = "test.django.settings"

[tool.coverage.run]
parallel = true
branch = true
source_pkgs = ["xdump"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages", ".tox/*/lib/*/site-packages", ".tox/*/Lib/site-packages"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = ["raise NotImplementedError", "^\\s*pass$"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "C",      # flake8-comprehensions
  "B",      # flake8-bugbear
  "D",      # pydocstyle
  "T201",   # flake8-print
  "I",      # isort
  "FURB",   # refurb
  "PGH003", # blanket-type-ignore
  "UP",     # pyupgrade
  "SIM",    # flake8-simplify
]
ignore = [
  "E501",   # Line too long
  "D100",   # Missing docstring in public module
  "D101",   # Missing docstring in public class
  "D102",   # Missing docstring in public method
  "D103",   # Missing docstring in public function
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D106",   # Missing docstring in public nested class
  "D107",   # Missing docstring in `__init__`
  "D202",   # No blank lines allowed after function docstring
  "D203",   # One blank line before class
  "D213",   # Multiline summary second line
  "D401",   # Imperative mood
  "D407",   # Missing dashed underline after section
]

[tool.ruff.lint.isort]
known-first-party = ["xdump"]
